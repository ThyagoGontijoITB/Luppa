server:
  port: ${PORT:${SERVER_PORT:8081}}

spring:
  application:
    name: luppa-api
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:luppaBD};encrypt=${DB_ENCRYPT:true};trustServerCertificate=${DB_TRUST_SERVER_CERTIFICATE:true}
    username: ${DB_USERNAME:luppa_app}
    password: ${DB_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

app:
  production-safety:
    enabled: false
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_TO_A_256_BIT_SECRET_BEFORE_RUNNING_OUTSIDE_DEV}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  storage:
    local-directory: ${IMAGE_STORAGE_DIR:uploads/events}
    public-base-url: ${IMAGE_PUBLIC_BASE_URL:http://localhost:8081/uploads/events}
    profile-local-directory: ${PROFILE_IMAGE_STORAGE_DIR:uploads/profile}
    profile-public-base-url: ${PROFILE_IMAGE_PUBLIC_BASE_URL:http://localhost:8081/uploads/profile}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    root-folder: ${CLOUDINARY_ROOT_FOLDER:luppa}
  geocoding:
    provider: ${GEOCODING_PROVIDER:none}
    base-url: ${GEOCODING_BASE_URL:}
  email:
    from: ${LUPPA_EMAIL_FROM:no-reply@luppa.com}
    logo-url: ${LUPPA_EMAIL_LOGO_URL:}
    app-base-url: ${APP_BASE_URL:http://localhost:5173}
    terms-url: ${LUPPA_TERMS_URL:http://localhost:5173/terms}
    privacy-url: ${LUPPA_PRIVACY_URL:http://localhost:5173/privacy}
    support-to: ${LUPPA_SUPPORT_EMAIL:projetoluppa@gmail.com}
  bootstrap:
    admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
      name: ${ADMIN_NAME:Luppa Admin}
      phone: ${ADMIN_PHONE:0000000000}
      date-of-birth: ${ADMIN_DATE_OF_BIRTH:1990-01-01}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    trusted-proxy-cidrs: ${TRUSTED_PROXY_CIDRS:}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
