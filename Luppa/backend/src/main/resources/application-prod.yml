spring:
  datasource:
    url: jdbc:sqlserver://${DB_HOST}:${DB_PORT:1433};databaseName=${DB_NAME};encrypt=true;trustServerCertificate=false
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    properties:
      hibernate:
        format_sql: false
app:
  production-safety:
    enabled: true
  cors:
    allowed-origins: ${FRONTEND_URL}
  jwt:
    secret: ${JWT_SECRET}
  storage:
    local-directory: ${IMAGE_STORAGE_DIR:}
    public-base-url: ${IMAGE_PUBLIC_BASE_URL:}
    profile-local-directory: ${PROFILE_IMAGE_STORAGE_DIR:}
    profile-public-base-url: ${PROFILE_IMAGE_PUBLIC_BASE_URL:}
  email:
    from: ${LUPPA_EMAIL_FROM}
    app-base-url: ${APP_BASE_URL}
    terms-url: ${LUPPA_TERMS_URL}
    privacy-url: ${LUPPA_PRIVACY_URL}
    support-to: ${LUPPA_SUPPORT_EMAIL}
  brevo:
    api-key: ${BREVO_API_KEY}
    endpoint: ${BREVO_API_ENDPOINT:https://api.brevo.com/v3/smtp/email}
    connect-timeout: ${BREVO_CONNECT_TIMEOUT:5s}
    request-timeout: ${BREVO_REQUEST_TIMEOUT:10s}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn
